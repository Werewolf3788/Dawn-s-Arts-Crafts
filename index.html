  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const MENU_ENDPOINT = './Menu.json';
      const SHEET_CSV_ENDPOINT = '//docs.google.com/spreadsheets/d/e/2PACX-1vRe4Cwhr4XIkNdg0lQFwUugrwtrNoV9ser4QTJ9t7LXe4RzGNEjrNKzKNMqUQh1jav8MYuZtLqMSUEi/pub?gid=0&single=true&output=csv';

      let catalogData = [];
      let activeCategory = 'ALL';
      let previousCsvPayload = '';

      // DOM Elements
      const menuNav = document.getElementById('menuNav');
      const navToggle = document.getElementById('navToggle');
      const catalogGrid = document.getElementById('catalogGrid');
      const filterBar = document.getElementById('filterBar');
      const productModal = document.getElementById('productModal');
      const modalCloseBtn = document.getElementById('modalCloseBtn');
      const modalImg = document.getElementById('modalImg');
      const modalTitle = document.getElementById('modalTitle');
      const modalCategory = document.getElementById('modalCategory');
      const modalPrice = document.getElementById('modalPrice');
      const modalDesc = document.getElementById('modalDesc');

      /* ==========================================================================
         Category Color Engine
         ========================================================================== */
      const categoryColorPalette = [
        { bg: '#fee2e2', text: '#991b1b' }, // rose
        { bg: '#ede9fe', text: '#6d28d9' }, // violet
        { bg: '#e0f2fe', text: '#0369a1' }, // sky blue
        { bg: '#fef3c7', text: '#92400e' }, // amber
        { bg: '#dcfce7', text: '#166534' }, // emerald
        { bg: '#fce7f3', text: '#9d174d' }  // pink
      ];

      function getCategoryColors(categoryName) {
        if (!categoryName) return categoryColorPalette[0];
        let hash = 0;
        for (let i = 0; i < categoryName.length; i++) {
          hash = categoryName.charCodeAt(i) + ((hash << 5) - hash);
        }
        const index = Math.abs(hash) % categoryColorPalette.length;
        return categoryColorPalette[index];
      }

      /* ==========================================================================
         Navigation & Mobile Menu
         ========================================================================== */
      if (navToggle && menuNav) {
        navToggle.addEventListener('click', () => {
          menuNav.classList.toggle('active');
        });
      }

      function configureLink(linkEl, href) {
        linkEl.href = href;
        try {
          const targetUrl = new URL(href, window.location.href);
          if (targetUrl.hostname !== window.location.hostname) {
            linkEl.target = '_blank';
            linkEl.rel = 'noopener noreferrer';
          } else {
            linkEl.target = '_self';
          }
        } catch (e) {
          linkEl.target = '_self';
        }
      }

      async function loadMenu() {
        if (!menuNav) return;
        try {
          const minuteWindow = Math.floor(Date.now() / 60000);
          const response = await fetch(`${MENU_ENDPOINT}?_cb=${minuteWindow}`);
          if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
          const data = await response.json();

          menuNav.innerHTML = '';
          const items = Array.isArray(data) ? data : (data.menu || data.items || []);

          items.forEach(item => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.textContent = item.title || item.name || 'Link';
            configureLink(a, item.url || item.link || '#');
            li.appendChild(a);
            menuNav.appendChild(li);
          });
        } catch (err) {
          console.warn('Menu load error, fallback activated:', err);
          menuNav.innerHTML = '<li><a href="./" target="_self">Home</a></li>';
        }
      }

      /* ==========================================================================
         Robust CSV Parser
         ========================================================================== */
      function parseCSV(text) {
        const lines = [];
        let row = [];
        let inQuotes = false;
        let cell = '';

        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          const next = text[i + 1];

          if (c === '"') {
            if (inQuotes && next === '"') {
              cell += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (c === ',' && !inQuotes) {
            row.push(cell.trim());
            cell = '';
          } else if ((c === '\r' || c === '\n') && !inQuotes) {
            if (c === '\r' && next === '\n') i++;
            row.push(cell.trim());
            if (row.length > 0 && row.some(col => col !== '')) {
              lines.push(row);
            }
            row = [];
            cell = '';
          } else {
            cell += c;
          }
        }
        if (cell || row.length > 0) {
          row.push(cell.trim());
          lines.push(row);
        }
        return lines;
      }

      /* ==========================================================================
         Catalog Grid & Modal Lightbox
         ========================================================================== */
      function renderCatalog() {
        if (!catalogGrid) return;
        catalogGrid.innerHTML = '';

        const filtered = catalogData.filter(item => {
          if (activeCategory === 'ALL') return true;
          return (item.category || '').toUpperCase() === activeCategory.toUpperCase();
        });

        if (filtered.length === 0) {
          catalogGrid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding: 3rem; font-weight:500;">No items found in this category.</div>';
          return;
        }

        filtered.forEach(item => {
          const card = document.createElement('article');
          card.className = 'card';

          let statusClass = 'status-other';
          const st = (item.status || '').toLowerCase();
          if (st.includes('avail')) statusClass = 'status-available';
          if (st.includes('sold')) statusClass = 'status-sold';

          const colors = getCategoryColors(item.category);

          card.innerHTML = `
            <div class="card-img-wrap">
              <img src="${item.imageUrl || '//placehold.co/600x400/faf7f2/64748b?text=Dawn%27s+Craft'}" loading="lazy">
              <span class="status-badge ${statusClass}">${item.status || 'Available'}</span>
            </div>
            <div class="card-body">
              <div class="card-category" style="background:${colors.bg}; color:${colors.text};">${item.category || 'Handcrafted'}</div>
              <h3 class="card-title">${item.productName || 'Handmade Creation'}</h3>
              <div class="card-price">
                <span>${item.price || 'Inquire for Price'}</span>
                <span class="view-cta">View Details &rarr;</span>
              </div>
            </div>
          `;

          card.addEventListener('click', () => openModal(item));
          catalogGrid.appendChild(card);
        });
      }

      function openModal(item) {
        if (!productModal) return;
        modalImg.src = item.imageUrl || '//placehold.co/600x400/faf7f2/64748b?text=Dawn%27s+Craft';
        modalImg.alt = `${item.productName} - Full Lightbox View`;
        modalTitle.textContent = item.productName || 'Handcrafted Creation';
        modalCategory.textContent = item.category || 'Craft';
        
        const colors = getCategoryColors(item.category);
        modalCategory.style.background = colors.bg;
        modalCategory.style.color = colors.text;

        modalPrice.textContent = item.price || 'Contact for Pricing';
        modalDesc.textContent = item.description || 'Handcrafted with care by Dawn. Reach out for custom dimensions or questions!';
        productModal.style.display = 'flex';
      }

      function closeModal() {
        if (productModal) {
          productModal.style.display = 'none';
          modalImg.src = '';
          modalImg.alt = '';
        }
      }

      if (modalCloseBtn) modalCloseBtn.addEventListener('click', closeModal);
      if (productModal) {
        productModal.addEventListener('click', (e) => {
          if (e.target === productModal) closeModal();
        });
      }

      function buildFilterButtons() {
        if (!filterBar) return;
        const categories = new Set();
        catalogData.forEach(item => {
          if (item.category) categories.add(item.category.trim());
        });

        filterBar.innerHTML = '';
        const allBtn = document.createElement('button');
        allBtn.className = 'filter-btn' + (activeCategory === 'ALL' ? ' active' : '');
        allBtn.textContent = 'All Creations';
        allBtn.addEventListener('click', () => {
          activeCategory = 'ALL';
          updateActiveFilterButton(allBtn);
          renderCatalog();
        });
        filterBar.appendChild(allBtn);

        categories.forEach(cat => {
          const btn = document.createElement('button');
          btn.className = 'filter-btn' + (activeCategory.toUpperCase() === cat.toUpperCase() ? ' active' : '');
          btn.textContent = cat;
          btn.addEventListener('click', () => {
            activeCategory = cat;
            updateActiveFilterButton(btn);
            renderCatalog();
          });
          filterBar.appendChild(btn);
        });
      }

      function updateActiveFilterButton(selectedBtn) {
        const buttons = filterBar.querySelectorAll('.filter-btn');
        buttons.forEach(b => b.classList.remove('active'));
        selectedBtn.classList.add('active');
      }

      /* ==========================================================================
         Google Sheets Smart Cache-Busting Feed Reader
         ========================================================================== */
      async function loadCatalogData() {
        try {
          const smartWindow = Math.floor(Date.now() / 60000);
          const liveCsvUrl = `${SHEET_CSV_ENDPOINT}&_cb=${smartWindow}`;

          const response = await fetch(liveCsvUrl);
          if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
          const csvText = await response.text();

          // Repaint only if sheet payload actually changed
          if (csvText === previousCsvPayload) {
            return;
          }
          previousCsvPayload = csvText;

          const rows = parseCSV(csvText);
          if (rows.length < 2) return;

          // Mapping: A: Item ID | B: Product Name | C: Category | D: Price | E: Image Url | F: Status | G: Description | H: Featured
          catalogData = rows.slice(1).map(row => ({
            itemId: row[0] || '',
            productName: row[1] || 'Handmade Craft',
            category: row[2] || 'Craft',
            price: row[3] || 'Inquire',
            imageUrl: row[4] || '',
            status: row[5] || 'Available',
            description: row[6] || '',
            featured: (row[7] || '').toLowerCase()
          }));

          buildFilterButtons();
          renderCatalog();
        } catch (err) {
          console.error('Error fetching sheet CSV:', err);
          if (catalogGrid && catalogData.length === 0) {
            catalogGrid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding: 2rem;">Loading Dawn\'s arts and crafts collection...</div>';
          }
        }
      }

      // Initial execution
      loadMenu();
      loadCatalogData();

      // Background poll every 60 seconds
      setInterval(() => {
        loadCatalogData();
      }, 60000);
    });
  </script>
</body>
</html>
