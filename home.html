  <style>
    :root {

    .nav-container {
      max-width: 1280px;

    .hero-banner {

    .filter-bar {
      display: flex;

    .filter-btn {
      background: var(--surface-color);

    .card-body {

    }

    }

    .card-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      margin-top: auto;

    }

    /* Modal / Lightbox */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;

      z-index: 200;

    }

    .modal-content {
      background: var(--surface-color);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      max-width: 720px;

    .modal-img {

  <!-- Application Logic & Feed Ingestion (Lines 313-485) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Configuration Endpoints using protocol-relative paths
      const MENU_ENDPOINT = '//raw.githubusercontent.com/Werewolf3788/Dawn-s-Arts-Crafts/main/Menu.json';
      const SHEET_CSV_ENDPOINT = '//docs.google.com/spreadsheets/d/e/2PACX-1vRe4Cwhr4XIkNdg0lQFwUugrwtrNoV9ser4QTJ9t7LXe4RzGNEjrNKzKNMqUQh1jav8MYuZtLqMSUEi/pub?gid=0&single=true&output=csv';

      let catalogData = [];
      let activeCategory = 'ALL';

      // DOM Elements
      const menuNav = document.getElementById('menuNav');
      const navToggle = document.getElementById('navToggle');
      const catalogGrid = document.getElementById('catalogGrid');
      const filterBar = document.getElementById('filterBar');
      const productModal = document.getElementById('productModal');
      const modalCloseBtn = document.getElementById('modalCloseBtn');
      const modalImg = document.getElementById('modalImg');
      const modalTitle = document.getElementById('modalTitle');
      const modalCategory = document.getElementById('modalCategory');
      const modalPrice = document.getElementById('modalPrice');
      const modalDesc = document.getElementById('modalDesc');

      // Navigation Drawer Toggle
      if (navToggle && menuNav) {
        navToggle.addEventListener('click', () => {
          menuNav.classList.toggle('active');
        });
      }

      // Safe Link Setup Helper (Internal vs External Domain Handling)
      function configureLinkElement(linkEl, href) {
        linkEl.href = href;
        try {
          const targetUrl = new URL(href, window.location.href);
          if (targetUrl.hostname !== window.location.hostname) {
            linkEl.target = '_blank';
            linkEl.rel = 'noopener noreferrer';
          } else {
            linkEl.target = '_self';
          }
        } catch (e) {
          linkEl.target = '_self';
        }
      }

      // Fetch and Build Menu (Lines 357-388)
      async function loadNavigationMenu() {
        if (!menuNav) return;
        try {
          const response = await fetch(MENU_ENDPOINT);
          if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
          const menuItems = await response.json();

          menuNav.innerHTML = '';
          const items = Array.isArray(menuItems) ? menuItems : (menuItems.menu || menuItems.items || []);

          items.forEach(item => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.textContent = item.title || item.name || 'Link';
            configureLinkElement(a, item.url || item.link || '#');
            li.appendChild(a);
            menuNav.appendChild(li);
          });
        } catch (error) {
          console.warn('Navigation menu load fallback:', error);
          menuNav.innerHTML = '<li><a href="./" target="_self">Home</a></li>';
        }
      }

      // Robust CSV Parser handling quotes, commas, and line breaks (Lines 391-420)
      function parseCSV(text) {
        const lines = [];
        let row = [];
        let inQuotes = false;
        let cell = '';

        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          const next = text[i + 1];

          if (c === '"') {
            if (inQuotes && next === '"') {
              cell += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (c === ',' && !inQuotes) {
            row.push(cell.trim());
            cell = '';
          } else if ((c === '\r' || c === '\n') && !inQuotes) {
            if (c === '\r' && next === '\n') i++;
            row.push(cell.trim());
            if (row.length > 0 && row.some(col => col !== '')) {
              lines.push(row);
            }
            row = [];
            cell = '';
          } else {
            cell += c;
          }
        }
        if (cell || row.length > 0) {
          row.push(cell.trim());
          lines.push(row);
        }
        return lines;
      }

      // Render Cards to Grid (Lines 423-455)
      function renderCatalog() {
        if (!catalogGrid) return;
        catalogGrid.innerHTML = '';

        const filtered = catalogData.filter(item => {
          if (activeCategory === 'ALL') return true;
          return (item.category || '').toUpperCase() === activeCategory.toUpperCase();
        });

        if (filtered.length === 0) {
          catalogGrid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding: 2rem;">No items currently available in this category.</div>';
          return;
        }

        filtered.forEach(item => {
          const card = document.createElement('article');
          card.className = 'card';
          
          let statusClass = 'status-other';
          const st = (item.status || '').toLowerCase();
          if (st.includes('avail')) statusClass = 'status-available';
          if (st.includes('sold')) statusClass = 'status-sold';

          card.innerHTML = `
            <div class="card-img-wrap">
              <img src="${item.imageUrl || '//placehold.co/600x400/171a21/9aa4b2?text=Craft'}" loading="lazy">
              <span class="status-badge ${statusClass}">${item.status || 'Available'}</span>
            </div>
            <div class="card-body">
              <div class="card-category">${item.category || 'Handcrafted'}</div>
              <h3 class="card-title">${item.productName || 'Untitled Piece'}</h3>
              <div class="card-price">${item.price || 'Inquire'}</div>
            </div>
          `;

          card.addEventListener('click', () => openModal(item));
          catalogGrid.appendChild(card);
        });
      }

      // Lightbox Modal Handlers (Lines 458-479)
      function openModal(item) {
        if (!productModal) return;
        modalImg.src = item.imageUrl || '//placehold.co/600x400/171a21/9aa4b2?text=Craft';
        // Descriptive alt text restricted solely to lightbox view
        modalImg.alt = `${item.productName} - Detailed View`;
        modalTitle.textContent = item.productName || 'Handcrafted Item';
        modalCategory.textContent = item.category || 'Craft';
        modalPrice.textContent = item.price || 'Price upon inquiry';
        modalDesc.textContent = item.description || 'No additional details provided.';
        productModal.style.display = 'flex';
      }

      function closeModal() {
        if (productModal) {
          productModal.style.display = 'none';
          modalImg.src = '';
          modalImg.alt = '';
        }
      }

      if (modalCloseBtn) modalCloseBtn.addEventListener('click', closeModal);
      if (productModal) {
        productModal.addEventListener('click', (e) => {
          if (e.target === productModal) closeModal();
        });
      }

      // Category Filter Builder (Lines 482-506)
      function buildFilterButtons() {
        if (!filterBar) return;
        const categories = new Set();
        catalogData.forEach(item => {
          if (item.category) categories.add(item.category.trim());
        });

        filterBar.innerHTML = '';
        const allBtn = document.createElement('button');
        allBtn.className = 'filter-btn' + (activeCategory === 'ALL' ? ' active' : '');
        allBtn.textContent = 'All Items';
        allBtn.addEventListener('click', () => {
          activeCategory = 'ALL';
          updateActiveFilterButton(allBtn);
          renderCatalog();
        });
        filterBar.appendChild(allBtn);

        categories.forEach(cat => {
          const btn = document.createElement('button');
          btn.className = 'filter-btn' + (activeCategory.toUpperCase() === cat.toUpperCase() ? ' active' : '');
          btn.textContent = cat;
          btn.addEventListener('click', () => {
            activeCategory = cat;
            updateActiveFilterButton(btn);
            renderCatalog();
          });
          filterBar.appendChild(btn);
        });
      }

      function updateActiveFilterButton(selectedBtn) {
        const buttons = filterBar.querySelectorAll('.filter-btn');
        buttons.forEach(b => b.classList.remove('active'));
        selectedBtn.classList.add('active');
      }

      // Fetch & Process Catalog CSV (Lines 509-548)
      async function loadCatalogData() {
        try {
          const response = await fetch(SHEET_CSV_ENDPOINT);
          if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
          const csvText = await response.text();
          const rows = parseCSV(csvText);

          if (rows.length < 2) {
            console.log('No data rows found in Google Sheet feed.');
            return;
          }

          // Expected Layout:
          // A: Item ID | B: Product Name | C: Category | D: Price | E: Image Url | F: Status | G: Description | H: Featured
          catalogData = rows.slice(1).map(row => ({
            itemId: row[0] || '',
            productName: row[1] || 'Handmade Craft',
            category: row[2] || 'General',
            price: row[3] || 'Inquire',
            imageUrl: row[4] || '',
            status: row[5] || 'Available',
            description: row[6] || '',
            featured: (row[7] || '').toLowerCase()
          }));

          buildFilterButtons();
          renderCatalog();
        } catch (error) {
          console.error('Failed to load Google Sheet catalog:', error);
          if (catalogGrid) {
            catalogGrid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding: 2rem;">Unable to load catalog at this moment. Please check back shortly.</div>';
          }
        }
      }

      // Initialize App Execution
      loadNavigationMenu();
      loadCatalogData();
    });
  </script>
